<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>

  .box{text-align:center;padding:60px 40px;max-width:480px;}
  .icon{font-size:48px;margin-bottom:20px;}
  h1{font-family:'Cormorant Garamond',serif;font-size:36px;color:#1C2F4A;margin-bottom:12px;}
  p{font-size:15px;color:#4A5568;line-height:1.7;margin-bottom:32px;}
  a{display:inline-block;padding:13px 32px;background:#1C2F4A;color:#fff;text-decoration:none;border-radius:4px;font-size:13px;font-weight:600;letter-spacing:0.05em;transition:background 0.2s;}
  a:hover{background:#2563A8;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">✉️</div>
  <h1>Message Sent!</h1>

</html>
